server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # git pushes and uploads can be large
    client_max_body_size 0;

    # lumina-world: published tiles, catalogs and packs from the lumina-world-www container
    location /world/tiles/ {
        proxy_pass http://127.0.0.1:8930;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ ^/world/regions/[^/]+/catalog\.json$ {
        proxy_pass http://127.0.0.1:8930;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
    }

    # packs are large: stream them, no temp file on the host
    location /world/ {
        proxy_pass http://127.0.0.1:8930;
        proxy_set_header Host $host;
        proxy_max_temp_file_size 0;
    }

    location / {
        proxy_pass http://127.0.0.1:8929;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
